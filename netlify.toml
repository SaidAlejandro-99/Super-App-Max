# Publicación en Netlify (superapp-max.netlify.app).
# Se publica a mano, solo cuando Said aprueba una versión: cada publicación
# gasta 15 créditos del plan gratis. Ver ESTADO.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Cabeceras de seguridad (auditoría 2026-11-10, SEG-08). La CSP solo deja cargar código de la
# propia app y del CDN de la librería de Excel, y solo conectarse a Supabase del proyecto.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://tswwuuoayeprvtfcxvdu.supabase.co wss://tswwuuoayeprvtfcxvdu.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
